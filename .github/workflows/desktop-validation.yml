name: Validate desktop changes (no release)
on:
  push:
    branches: ['review/claude-walkable']
    paths:
      - 'CCStats.Desktop/**'
      - 'CCStats.Core/**'
      - 'PvpStats/Analysis/**'
      - 'tests/DesktopChecks/**'
      - '.github/workflows/desktop-validation.yml'
  workflow_dispatch:
    inputs:
      include_test_package:
        description: '另存内部测试包（不创建发行版或更新下载库）'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        edition: [Global, China]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Core and background recording checks
        shell: pwsh
        run: |
          dotnet restore CCStats.Desktop.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          $zones = @('UTC', 'China Standard Time', 'Tokyo Standard Time', 'Eastern Standard Time', 'Nepal Standard Time')
          $previousZone = (Get-TimeZone).Id
          try {
            foreach ($zone in $zones) {
              Set-TimeZone -Id $zone
              Write-Host "Validating record time in $zone"
              dotnet run --project tests/DesktopChecks -c Release --no-restore -p:CCStatsEdition=${{ matrix.edition }}
              if ($LASTEXITCODE -ne 0) { throw "Core checks failed in $zone" }
            }
          } finally {
            Set-TimeZone -Id $previousZone
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{ Success = $true; Zones = $zones } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/time-zone-validation.json
          dotnet publish CCStats.Desktop/CCStats.Desktop.csproj -c Release --no-restore -p:CCStatsEdition=${{ matrix.edition }} -o artifacts/internal-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Window, tray, close dialog and replay checks
        shell: pwsh
        run: |
          $previousZone = (Get-TimeZone).Id
          try {
            Set-TimeZone -Id 'Tokyo Standard Time'
            $report = Join-Path $PWD 'artifacts/desktop-validation.json'
            $exe = Join-Path $PWD 'artifacts/internal-desktop/CCStats.Desktop.exe'
            $app = Start-Process $exe -ArgumentList @('--smoke-test', $report) -PassThru
            if (!$app.WaitForExit(120000)) { $app.Kill(); throw 'Window checks timed out' }
            if ($app.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw 'Window checks failed' }
            $result = Get-Content $report | ConvertFrom-Json
            if ($result.utcOffsetMinutes -ne 540) { throw 'Replay checks did not run in the requested non-UTC timezone' }
            $expectedNavigation = if ('${{ matrix.edition }}' -eq 'China') { 8 } else { 9 }
            if ($result.edition -ne '${{ matrix.edition }}' -or $result.rankingsEnabled -ne ('${{ matrix.edition }}' -ne 'China')) { throw 'Distribution or leaderboard isolation failed' }
            if (!$result.success -or $result.navigation -ne $expectedNavigation -or !$result.tray -or !$result.closeChoice -or !$result.replay) { throw 'Incomplete window checks' }
            Get-Content $report
          } finally {
            Set-TimeZone -Id $previousZone
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation-report-${{ matrix.edition }}
          path: |
            artifacts/desktop-validation.json
            artifacts/time-zone-validation.json
            artifacts/desktop-validation.png
            artifacts/desktop-validation.replay.png
            artifacts/desktop-validation.detail.png
            artifacts/desktop-validation.事件时间线.png
            artifacts/desktop-validation.推进曲线.png
            artifacts/desktop-validation.技能分析.png

      - name: Package manually requested test build
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.include_test_package) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[internal-test-package]')))
        shell: pwsh
        run: |
          @{ Commit = '${{ github.sha }}'; BuiltAtUtc = [DateTime]::UtcNow.ToString('O'); Kind = 'Internal sampling build'; Edition = '${{ matrix.edition }}'; WindowsChecks = (Get-Content artifacts/desktop-validation.json | ConvertFrom-Json) } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/internal-desktop/build-info.json
      - uses: actions/upload-artifact@v4
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.include_test_package) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[internal-test-package]')))
        with:
          name: ${{ matrix.edition == 'China' && 'CCStats-Desktop-CN-internal-test' || 'CCStats-Desktop-internal-test' }}
          path: artifacts/internal-desktop/
          retention-days: 7
